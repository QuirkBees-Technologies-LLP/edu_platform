name: Build and deploy Vite + Node app to Azure Web App - edu

on:
  push:
    branches:
      - prod

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      # 3️⃣ Install dependencies and build frontend
      - name: Install dependencies and build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_APP_API_URL: ${{ secrets.VITE_APP_API_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
          VITE_APP_VERSION: ${{ secrets.VITE_APP_VERSION }}
          GENERATE_SOURCEMAP: ${{ secrets.GENERATE_SOURCEMAP }}
          VITE_APP_CRM_API_KEY: ${{ secrets.VITE_APP_CRM_API_KEY }}
          VITE_APP_STREAM_API_KEY: ${{ secrets.VITE_APP_STREAM_API_KEY }}
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm ci
          npm run build

      # 4️⃣ Prepare ZIP (this is the critical part)
      - name: Prepare deployment ZIP
        run: |
          mkdir tempdeploy
          cp -r dist tempdeploy/dist
          cp server.js package.json package-lock.json tempdeploy/
          cd tempdeploy
          zip -r ../site.zip *   # 👈 ensures files are at ZIP root
          cd ..
          unzip -l site.zip | grep server.js || echo "❌ server.js not found in ZIP!"

      # 5️⃣ Login to Azure
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_88D21AAB24FB453183DD18FA2E8CB5A4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_76075C8D564542E2B56E0A2DC5156C6B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CCB2529DDE84406A4CB3A4D67D43139 }}

      # 6️⃣ Deploy ZIP to Azure Web App
      - name: Deploy to Azure Web App (Production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'edu'
          slot-name: 'production'
          package: site.zip
