# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy Vite app to Azure Web App - edu (Staging)
on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies and build
        env:
          VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL }}
          VITE_APP_API_URL: ${{ secrets.STAGING_VITE_APP_API_URL }}
          VITE_APP_NAME: ${{ secrets.STAGING_VITE_APP_NAME }}
          VITE_APP_VERSION: ${{ secrets.STAGING_VITE_APP_VERSION }}
          GENERATE_SOURCEMAP: ${{ secrets.STAGING_GENERATE_SOURCEMAP }}
          VITE_APP_CRM_API_KEY: ${{ secrets.STAGING_VITE_APP_CRM_API_KEY }}
          VITE_APP_STREAM_API_KEY: ${{ secrets.STAGING_VITE_APP_STREAM_API_KEY }}
        run: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          npm ci
          npm run build

          # Create a runtime folder (not just dist)
          mkdir runtime
          cp -r dist runtime/dist
          cp server.js runtime/
          echo '{"name":"edu-app","version":"1.0.0","type":"module","main":"server.js","dependencies":{"express":"^4.21.2"},"scripts":{"start":"node server.js"}}' > runtime/package.json
          
          cd runtime
          npm install --production
          zip -r ../site.zip *

      - name: Deploy to Azure Web App (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'edu'
          slot-name: 'edu-staging'
          publish-profile: ${{ secrets.EDU_STAGING_PUBLISH_PROFILE }}
          package: site.zip
