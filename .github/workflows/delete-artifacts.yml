name: Delete Old Artifacts

on:
  workflow_dispatch:

permissions:
  actions: write  # 👈 REQUIRED to delete artifacts
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '0'  # delete all artifacts
